name: Native Linux Canvas validation
on:
  push:
    branches: ['codex/linux-canvas-validation-*']
    paths: ['src/**', 'index.js', 'build.rs', 'Cargo*', 'package*.json', 'snapshot/**', 'scripts/build-linux.py', 'scripts/prepare-native.cjs', 'scripts/bundle-canvas.cjs', '.github/workflows/linux-canvas-validation.yml']
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - name: Install build dependencies
        timeout-minutes: 8
        run: |
          uname -a
          command -v clang clang++ clang-18 clang++-18 gcc g++ ninja make cmake pkg-config pkgconf rustc cargo python3 || true
          ls /usr/bin/clang* /usr/bin/*ninja* /usr/bin/pkg* /usr/include/fontconfig/fontconfig.h /usr/include/freetype2/ft2build.h || true
          fc-list | head -20 || true
      - uses: actions/cache/restore@v4
        id: skia-cache
        with:
          path: third_party/skia
          key: skia-linux-24-v1-${{ hashFiles('snapshot/linux-skia-args.gn', 'scripts/build-linux.py') }}
          restore-keys: skia-linux-24-v1-
      - name: Build complete native Canvas
        run: python3 scripts/build-linux.py
      - uses: actions/cache/save@v4
        if: always() && steps.skia-cache.outputs.cache-hit != 'true'
        with:
          path: third_party/skia
          key: ${{ steps.skia-cache.outputs.cache-primary-key }}
      - name: Test original API
        env:
          CANVAS_DIAGNOSTICS: '1'
        run: node --expose-gc scripts/test-native-api.js ./dist/canvas-linux/canvas.node | tee dist/canvas-linux/test-result.json
      - uses: actions/upload-artifact@v4
        with:
          name: linux-canvas-native
          path: dist/canvas-linux/
